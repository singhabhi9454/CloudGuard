version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudguard-backend
    ports:
      - "8000:8000"
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      # Optional SMTP alert notification variables
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - ALERT_RECIPIENT_EMAIL=${ALERT_RECIPIENT_EMAIL:-}
    volumes:
      # Mount SQLite database for persistence
      - ./cloudguard.db:/app/cloudguard.db
      # Mount host AWS credentials safely as read-only
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
